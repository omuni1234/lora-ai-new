name: 共通100地点・独立ランダムWaypoint移動
seed: 5
duration_s: 1800
area_m: [2000, 2000]
groups:
  - name: mobile
    count: 20
    observe_position: true
    mobility:
      kind: waypoints
      options:
        mode: random_waypoint
        waypoint_count: 100
        waypoint_seed: 0
        speed_min_m_s: 1.6
        speed_max_m_s: 2.4
        pause_min_s: 5
        pause_max_s: 15
    timing:
      kind: periodic
      options:
        interval_s: 120
        start: {mode: uniform, min_s: 0, max_s: 120}
