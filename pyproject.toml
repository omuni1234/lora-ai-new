[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lorasim-research"
version = "0.9.0"
description = "Source-traceable Class A LoRaWAN research simulator"
requires-python = ">=3.10"
license = {text = "GPL-2.0-only"}
dependencies = ["numpy>=1.24,<3", "pyarrow>=14,<24", "PyYAML>=6,<7", "pydantic>=2.7,<3", "fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
analysis = ["pandas>=2", "matplotlib>=3.8"]
gpu = ["torch>=2.2"]

[project.scripts]
lorasim = "lorasim.cli:main"

[tool.setuptools.packages.find]
include = ["lorasim*"]

[tool.setuptools.package-data]
lorasim = ["static/*", "upstream.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
